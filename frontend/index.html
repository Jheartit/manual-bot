<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>생명 주니</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  /* ============================================================
     DESIGN.md 토큰 매핑 (Apple-design-analysis, alpha)
     colors / rounded / spacing 값은 문서 그대로. SF Pro는 Apple
     플랫폼 밖에서 렌더링되지 않으므로, 문서의 "Note on Font
     Substitutes" 지침대로 한글 대응 폰트(Pretendard)를 그 다음
     순위로 붙였다.
     ============================================================ */
  :root {
    /* colors.* */
    --color-primary: #0066cc;
    --color-primary-focus: #0071e3;
    --color-primary-on-dark: #2997ff;
    --color-ink: #1d1d1f;
    --color-body-muted: #cccccc;
    --color-ink-muted-80: #333333;
    --color-ink-muted-48: #7a7a7a;
    --color-divider-soft: #f0f0f0;
    --color-hairline: #e0e0e0;
    --color-canvas: #ffffff;
    --color-canvas-parchment: #f5f5f7;
    --color-surface-pearl: #fafafc;
    --color-on-primary: #ffffff;
    --color-on-dark: #ffffff;

    /* rounded.* */
    --radius-xs: 5px;
    --radius-sm: 8px;
    --radius-md: 11px;
    --radius-lg: 18px;
    --radius-pill: 9999px;

    /* spacing.* */
    --space-xxs: 4px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 17px;
    --space-lg: 24px;
    --space-xl: 32px;

    /* typography.* font families */
    --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Pretendard", sans-serif;
    --font-text: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    /* Do's: 페이지 캔버스는 parchment, 카드 표면은 canvas 흰색으로 대비를 준다 */
    background: var(--color-canvas-parchment);
    font-family: var(--font-text);
    color: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    max-width: 980px;
    height: calc(100vh - 48px);
    max-height: 800px;
    margin: 24px auto;
    background: var(--color-canvas);
    /* Don't: 카드에 그림자 금지. 대신 1px hairline으로만 경계를 표시 (elevation "Soft hairline") */
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  /* ---- sidebar ---- */
  .sidebar {
    background: var(--color-canvas-parchment);
    border-right: 1px solid var(--color-hairline);
    padding: var(--space-lg) var(--space-md);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin-bottom: var(--space-xl);
  }
  .brand-mark {
    /* button-icon-circular 그리드에 준한 원형/사각 마크. primary accent 사용 */
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    background: var(--color-primary);
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    color: var(--color-on-primary);
    flex-shrink: 0;
  }
  .brand-title {
    /* typography.caption-strong: 14px/600/1.29/-0.224px */
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    letter-spacing: -0.224px;
    color: var(--color-ink);
  }
  .brand-sub {
    /* typography.fine-print: 12px/400/1.0/-0.12px */
    font-family: var(--font-text);
    font-size: 12px;
    line-height: 1.0;
    letter-spacing: -0.12px;
    color: var(--color-ink-muted-48);
    margin-top: 3px;
  }
  .filter-label {
    /* typography.nav-link: 12px/400/1.0/-0.12px */
    font-family: var(--font-text);
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--color-ink-muted-48);
    margin-bottom: var(--space-sm);
  }
  .company-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: var(--space-xl);
  }
  .company-item {
    /* button-utility 타이포(14px/400/-0.224px) + compact utility 라운드(sm) */
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--radius-sm);
    padding: var(--space-xs) var(--space-sm);
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 1.29;
    letter-spacing: -0.224px;
    color: var(--color-ink-muted-80);
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .company-item:hover { background: var(--color-divider-soft); }
  .company-item.active {
    color: var(--color-primary);
    background: var(--color-surface-pearl);
    font-weight: 600;
  }
  .company-item:active { transform: scale(0.97); }
  .sidebar-footer {
    margin-top: auto;
    padding-top: var(--space-sm);
    border-top: 1px solid var(--color-hairline);
    font-family: var(--font-text);
    font-size: 10px;
    line-height: 1.3;
    letter-spacing: -0.08px;
    color: var(--color-ink-muted-48);
  }

  /* ---- main chat ---- */
  .chat { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--color-canvas); }
  .chat-header {
    position: relative;
    padding: var(--space-lg) 64px var(--space-sm) var(--space-lg);
    border-bottom: 1px solid var(--color-hairline);
    flex-shrink: 0;
  }
  .chat-header h1 {
    /* typography.tagline: 21px/600/1.19/0.231px — sub-nav-frosted 카테고리명과 같은 역할 */
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
    color: var(--color-ink);
    margin: 0 0 4px;
  }
  .chat-header p {
    /* typography.caption: 14px/400/1.43/-0.224px */
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 1.43;
    letter-spacing: -0.224px;
    color: var(--color-ink-muted-48);
    margin: 0;
  }
  .new-chat-btn {
    /* component.button-dark-utility */
    position: absolute;
    top: var(--space-lg);
    right: var(--space-lg);
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--color-ink);
    color: var(--color-on-dark);
    font-family: var(--font-text);
    font-size: 14px;
    letter-spacing: -0.224px;
    padding: var(--space-xs) 15px;
    cursor: pointer;
  }
  .new-chat-btn:hover { background: var(--color-ink-muted-80); }
  .new-chat-btn:active { transform: scale(0.95); }
  .chat-scroll {
    flex: 1;
    min-height: 0;
    padding: var(--space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
    overflow-y: auto;
  }

  .msg-user {
    /* 다크 타일 문법 재사용: ink 배경 + on-dark 텍스트 */
    align-self: flex-end;
    max-width: 70%;
    background: var(--color-ink);
    color: var(--color-on-dark);
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-lg);
    font-family: var(--font-text);
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.374px;
  }

  .msg-bot { max-width: 82%; }
  .msg-bot-text {
    /* typography.body: 17px/400/1.47/-0.374px — Do: body는 반드시 17px */
    font-family: var(--font-text);
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    color: var(--color-ink);
    white-space: pre-line;
  }
  .msg-bot-text a { color: var(--color-primary); }
  .msg-bot-text strong { font-weight: 600; }
  .web-note {
    /* typography.caption, parchment 표면 + primary 텍스트로 최소한의 강조만 부여 */
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 1.43;
    letter-spacing: -0.224px;
    color: var(--color-primary);
    margin-top: var(--space-xs);
    padding: 6px var(--space-sm);
    background: var(--color-canvas-parchment);
    border-radius: var(--radius-md);
    display: inline-block;
  }
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-xxs);
    margin-top: var(--space-sm);
  }
  .stamp {
    /* configurator-option-chip 문법(pill + canvas + hairline) 축소 적용 */
    border: 1px solid var(--color-hairline);
    color: var(--color-ink-muted-48);
    background: var(--color-canvas);
    border-radius: var(--radius-pill);
    font-family: var(--font-text);
    font-size: 12px;
    letter-spacing: -0.12px;
    padding: 4px var(--space-sm);
    white-space: nowrap;
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--color-ink-muted-48);
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .composer {
    display: flex;
    gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg) var(--space-lg);
    border-top: 1px solid var(--color-hairline);
    flex-shrink: 0;
  }
  .composer input {
    /* component.search-input */
    flex: 1;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--radius-pill);
    background: var(--color-canvas);
    padding: var(--space-sm) 20px;
    height: 44px;
    font-family: var(--font-text);
    font-size: 17px;
    letter-spacing: -0.374px;
    color: var(--color-ink);
    outline: none;
  }
  .composer input:focus { outline: 2px solid var(--color-primary-focus); outline-offset: 1px; }
  .composer button {
    /* component.button-primary */
    border: none;
    border-radius: var(--radius-pill);
    background: var(--color-primary);
    color: var(--color-on-primary);
    padding: 11px 22px;
    font-family: var(--font-text);
    font-size: 17px;
    letter-spacing: -0.374px;
    cursor: pointer;
  }
  .composer button:hover { background: var(--color-primary-focus); }
  .composer button:active { transform: scale(0.95); }
  .composer button:disabled { opacity: 0.5; cursor: default; transform: none; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">保</div>
      <div>
        <div class="brand-title">생명 주니</div>
        <div class="brand-sub">청약·배서 매뉴얼 어시스턴트</div>
      </div>
    </div>
    <div class="filter-label">생명사 필터</div>
    <div class="company-list" id="companyList">
      <button class="company-item active" data-company="전체">전체</button>
      <button class="company-item" data-company="삼성생명">삼성생명</button>
      <button class="company-item" data-company="한화생명">한화생명</button>
      <button class="company-item" data-company="교보생명">교보생명</button>
      <button class="company-item" data-company="신한라이프">신한라이프</button>
      <button class="company-item" data-company="NH농협생명">NH농협생명</button>
      <button class="company-item" data-company="미래에셋생명">미래에셋생명</button>
    </div>
    <div class="sidebar-footer">
      자료 출처: 사내 구글드라이브<br>
      최근 동기화: 오늘 06:00
    </div>
  </aside>

  <main class="chat">
    <div class="chat-header">
      <h1>생명 주니</h1>
      <p id="scopeText">전체 생명사 자료를 기준으로 답변합니다</p>
      <button class="new-chat-btn" id="newChatBtn" title="새 대화 시작">＋ 새 대화</button>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>

    <div class="composer">
      <input type="text" id="msgInput" placeholder="궁금한 청약·배서 조건을 입력하세요">
      <button id="sendBtn">보내기</button>
    </div>
  </main>
</div>

<script>
  const companyList = document.getElementById('companyList');
  const scopeText = document.getElementById('scopeText');
  companyList.addEventListener('click', (e) => {
    const btn = e.target.closest('.company-item');
    if (!btn) return;
    companyList.querySelectorAll('.company-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const company = btn.dataset.company;
    scopeText.textContent = company === '전체'
      ? '전체 생명사 자료를 기준으로 답변합니다'
      : company + ' 자료를 기준으로 답변합니다';
    currentCompanyFilter = company === '전체' ? null : company;
  });

  const chatScroll = document.getElementById('chatScroll');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');

  // 백엔드 API 주소 (Railway 배포 주소)
  const API_BASE_URL = 'https://manual-bot-production-69ac.up.railway.app';

  let currentCompanyFilter = null; // '전체'면 null, 특정 생명사면 해당 이름

  // 같은 브라우저로 다시 접속했을 때 이전 대화가 이어지도록 로컬에 저장.
  // 다른 사람의 브라우저(새 접속)에는 저장된 게 없으니 항상 새 화면으로 시작됨.
  const HISTORY_KEY = 'manualbot_chat_history';

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, chatScroll.innerHTML); } catch (e) { /* 무시 */ }
  }

  function showWelcome() {
    chatScroll.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';
    const textDiv = document.createElement('div');
    textDiv.className = 'msg-bot-text';
    textDiv.textContent = '안녕하세요! 청약·배서 매뉴얼에 대해 궁금한 점을 물어보세요.';
    wrap.appendChild(textDiv);
    chatScroll.appendChild(wrap);
  }

  function loadHistory() {
    let saved = null;
    try { saved = localStorage.getItem(HISTORY_KEY); } catch (e) { /* 무시 */ }
    if (saved) {
      chatScroll.innerHTML = saved;
      chatScroll.scrollTop = chatScroll.scrollHeight;
    } else {
      showWelcome();
    }
  }

  newChatBtn.addEventListener('click', () => {
    if (chatScroll.children.length && !confirm('새 대화를 시작하면 지금까지의 대화 내용이 사라집니다. 계속할까요?')) {
      return;
    }
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* 무시 */ }
    showWelcome();
  });

  loadHistory();

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.textContent = text;
    chatScroll.appendChild(div);
    saveHistory();
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  // GPT 답변에 마크다운(**굵게**, [텍스트](링크))이 섞여 오는데 그걸 그냥
  // textContent로 넣으면 별표/대괄호가 그대로 보인다. 최소한의 안전한
  // 마크다운만 실제 서식으로 바꿔준다 (HTML은 먼저 이스케이프해서 주입 방지).
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMarkdownLite(text) {
    let html = escapeHtml(text);
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^-\s+/gm, '• ');
    return html;
  }

  function addBotMessage(reply) {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();

    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';

    const textDiv = document.createElement('div');
    textDiv.className = 'msg-bot-text';
    textDiv.innerHTML = renderMarkdownLite(reply.text);
    wrap.appendChild(textDiv);

    if (reply.webNote) {
      const note = document.createElement('div');
      note.className = 'web-note';
      note.textContent = '자료 내 확인 불가 → 웹 검색으로 보완된 답변입니다';
      wrap.appendChild(note);
    }

    if (reply.sources.length) {
      const srcWrap = document.createElement('div');
      srcWrap.className = 'sources';
      reply.sources.forEach(s => {
        const tag = document.createElement('span');
        tag.className = 'stamp';
        tag.textContent = s.label;
        srcWrap.appendChild(tag);
      });
      wrap.appendChild(srcWrap);
    }

    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    saveHistory();
  }

  function addErrorMessage(message) {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';
    wrap.innerHTML = '<div class="msg-bot-text" style="color:#DC2626;">' + message + '</div>';
    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    saveHistory();
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;
    addUserMessage(text);
    input.value = '';
    sendBtn.disabled = true;
    chatScroll.scrollTop = chatScroll.scrollHeight;
    addTyping();

    try {
      const res = await fetch(API_BASE_URL + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: text,
          company_filter: currentCompanyFilter,
          top_k: 8
        })
      });

      if (!res.ok) {
        throw new Error('서버 응답 오류 (status ' + res.status + ')');
      }

      const data = await res.json();
      // rag_query.py 응답 형식: { answer: string, sources: [{company, doc_type, file_name}, ...] }
      const webNote = data.answer.includes('웹 검색으로 보완');
      addBotMessage({
        text: data.answer,
        sources: (data.sources || []).map(s =>
          ({ label: s.company + ' · ' + s.doc_type + '매뉴얼 · ' + s.file_name })
        ),
        webNote: webNote
      });
    } catch (err) {
      addErrorMessage(
        '백엔드에 연결할 수 없습니다 (' + err.message + '). ' +
        'rag_query.py 서버가 실행 중인지, API_BASE_URL 설정이 맞는지 확인해주세요.'
      );
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => {
    // 한글 등 IME로 조합 중일 때 Enter를 누르면 조합 완료와 Enter 입력이 겹쳐
    // 마지막 글자가 별도 메시지로 잘려 전송되는 문제가 있어, 조합 중에는 무시한다.
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) handleSend();
  });
</script>

</body>
</html>
