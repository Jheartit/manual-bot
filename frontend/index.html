<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>청약·배서 매뉴얼 어시스턴트</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --sidebar-bg: #FAFAFA;
    --text: #101828;
    --text-soft: #344054;
    --muted: #667085;
    --border: #E4E7EC;
    --accent: #2563EB;
    --accent-soft: #EFF4FF;
    --accent-strong: #1D4ED8;
    --danger: #DC2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    max-width: 980px;
    height: calc(100vh - 48px);
    max-height: 800px;
    margin: 24px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 24px rgba(16, 24, 40, 0.04);
  }
  /* ---- sidebar ---- */
  .sidebar {
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .filter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }
  .company-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 28px;
  }
  .company-item {
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--text-soft);
    cursor: pointer;
  }
  .company-item:hover { background: #F0F1F3; }
  .company-item.active {
    color: var(--accent-strong);
    background: var(--accent-soft);
    font-weight: 600;
  }
  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ---- main chat ---- */
  .chat { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--surface); }
  .chat-header {
    position: relative;
    padding: 20px 64px 16px 28px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chat-header h1 {
    font-size: 16.5px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .chat-header p {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  .new-chat-btn {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    color: var(--text-soft);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 13px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
  }
  .new-chat-btn:hover { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent-soft); }
  .chat-scroll {
    flex: 1;
    min-height: 0;
    padding: 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .msg-user {
    align-self: flex-end;
    max-width: 70%;
    background: var(--text);
    color: #FFFFFF;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    border-radius: 14px 14px 4px 14px;
  }

  .msg-bot { max-width: 82%; }
  .msg-bot-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-soft);
    white-space: pre-line;
  }
  .web-note {
    font-size: 12px;
    color: var(--accent-strong);
    margin-top: 8px;
    padding: 6px 10px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: inline-block;
  }
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  .stamp {
    border: 1px solid var(--border);
    color: var(--muted);
    background: #FAFAFA;
    border-radius: 999px;
    font-size: 11.5px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .composer {
    display: flex;
    gap: 10px;
    padding: 16px 28px 22px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer button {
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    padding: 0 20px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .composer button:hover { background: var(--accent-strong); }
  .composer button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">保</div>
      <div>
        <div class="brand-title">청약·배서<br>매뉴얼</div>
        <div class="brand-sub">어시스턴트</div>
      </div>
    </div>
    <div class="filter-label">생명사 필터</div>
    <div class="company-list" id="companyList">
      <button class="company-item active" data-company="전체">전체</button>
      <button class="company-item" data-company="삼성생명">삼성생명</button>
      <button class="company-item" data-company="한화생명">한화생명</button>
      <button class="company-item" data-company="교보생명">교보생명</button>
      <button class="company-item" data-company="신한라이프">신한라이프</button>
      <button class="company-item" data-company="NH농협생명">NH농협생명</button>
      <button class="company-item" data-company="미래에셋생명">미래에셋생명</button>
    </div>
    <div class="sidebar-footer">
      자료 출처: 사내 구글드라이브<br>
      최근 동기화: 오늘 06:00
    </div>
  </aside>

  <main class="chat">
    <div class="chat-header">
      <h1>청약·배서 매뉴얼 어시스턴트</h1>
      <p id="scopeText">전체 생명사 자료를 기준으로 답변합니다</p>
      <button class="new-chat-btn" id="newChatBtn" title="새 대화 시작">＋ 새 대화</button>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>

    <div class="composer">
      <input type="text" id="msgInput" placeholder="궁금한 청약·배서 조건을 입력하세요">
      <button id="sendBtn">보내기</button>
    </div>
  </main>
</div>

<script>
  const companyList = document.getElementById('companyList');
  const scopeText = document.getElementById('scopeText');
  companyList.addEventListener('click', (e) => {
    const btn = e.target.closest('.company-item');
    if (!btn) return;
    companyList.querySelectorAll('.company-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const company = btn.dataset.company;
    scopeText.textContent = company === '전체'
      ? '전체 생명사 자료를 기준으로 답변합니다'
      : company + ' 자료를 기준으로 답변합니다';
    currentCompanyFilter = company === '전체' ? null : company;
  });

  const chatScroll = document.getElementById('chatScroll');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');

  // 백엔드 API 주소 (Railway 배포 주소)
  const API_BASE_URL = 'https://manual-bot-production-69ac.up.railway.app';

  let currentCompanyFilter = null; // '전체'면 null, 특정 생명사면 해당 이름

  // 같은 브라우저로 다시 접속했을 때 이전 대화가 이어지도록 로컬에 저장.
  // 다른 사람의 브라우저(새 접속)에는 저장된 게 없으니 항상 새 화면으로 시작됨.
  const HISTORY_KEY = 'manualbot_chat_history';

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, chatScroll.innerHTML); } catch (e) { /* 무시 */ }
  }

  function showWelcome() {
    chatScroll.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';
    const textDiv = document.createElement('div');
    textDiv.className = 'msg-bot-text';
    textDiv.textContent = '안녕하세요! 청약·배서 매뉴얼에 대해 궁금한 점을 물어보세요.';
    wrap.appendChild(textDiv);
    chatScroll.appendChild(wrap);
  }

  function loadHistory() {
    let saved = null;
    try { saved = localStorage.getItem(HISTORY_KEY); } catch (e) { /* 무시 */ }
    if (saved) {
      chatScroll.innerHTML = saved;
      chatScroll.scrollTop = chatScroll.scrollHeight;
    } else {
      showWelcome();
    }
  }

  newChatBtn.addEventListener('click', () => {
    if (chatScroll.children.length && !confirm('새 대화를 시작하면 지금까지의 대화 내용이 사라집니다. 계속할까요?')) {
      return;
    }
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* 무시 */ }
    showWelcome();
  });

  loadHistory();

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.textContent = text;
    chatScroll.appendChild(div);
    saveHistory();
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function addBotMessage(reply) {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();

    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';

    const textDiv = document.createElement('div');
    textDiv.className = 'msg-bot-text';
    textDiv.textContent = reply.text;
    wrap.appendChild(textDiv);

    if (reply.webNote) {
      const note = document.createElement('div');
      note.className = 'web-note';
      note.textContent = '자료 내 확인 불가 → 웹 검색으로 보완된 답변입니다';
      wrap.appendChild(note);
    }

    if (reply.sources.length) {
      const srcWrap = document.createElement('div');
      srcWrap.className = 'sources';
      reply.sources.forEach(s => {
        const tag = document.createElement('span');
        tag.className = 'stamp';
        tag.textContent = s.label;
        srcWrap.appendChild(tag);
      });
      wrap.appendChild(srcWrap);
    }

    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    saveHistory();
  }

  function addErrorMessage(message) {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg-bot';
    wrap.innerHTML = '<div class="msg-bot-text" style="color:#DC2626;">' + message + '</div>';
    chatScroll.appendChild(wrap);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    saveHistory();
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;
    addUserMessage(text);
    input.value = '';
    sendBtn.disabled = true;
    chatScroll.scrollTop = chatScroll.scrollHeight;
    addTyping();

    try {
      const res = await fetch(API_BASE_URL + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: text,
          company_filter: currentCompanyFilter,
          top_k: 8
        })
      });

      if (!res.ok) {
        throw new Error('서버 응답 오류 (status ' + res.status + ')');
      }

      const data = await res.json();
      // rag_query.py 응답 형식: { answer: string, sources: [{company, doc_type, file_name}, ...] }
      const webNote = data.answer.includes('웹 검색으로 보완');
      addBotMessage({
        text: data.answer,
        sources: (data.sources || []).map(s =>
          ({ label: s.company + ' · ' + s.doc_type + '매뉴얼 · ' + s.file_name })
        ),
        webNote: webNote
      });
    } catch (err) {
      addErrorMessage(
        '백엔드에 연결할 수 없습니다 (' + err.message + '). ' +
        'rag_query.py 서버가 실행 중인지, API_BASE_URL 설정이 맞는지 확인해주세요.'
      );
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });
</script>

</body>
</html>
